# Local-only backend (NFR-04, FR-06): never listen beyond loopback.
server.address=127.0.0.1
server.port=8080
# Controlled application-data directory (FR-01). Override with EVM_DATA_DIR or --evm.data-dir=...
evm.data-dir=${EVM_DATA_DIR:${user.home}/.evm-insight}
# No stack traces or internal details in HTTP errors (FR-21)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.main.banner-mode=off
