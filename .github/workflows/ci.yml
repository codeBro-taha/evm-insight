name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests and coverage
        working-directory: backend
        shell: bash
        run: |
          set +e
          mvn -B test 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # surface failures as annotations (readable without downloading logs)
            grep -E "\\[ERROR\\]|FAIL|Tests run:.*(Failures: [1-9]|Errors: [1-9])" build.log | head -40 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
